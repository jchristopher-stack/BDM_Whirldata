name: Deploy Therapist Frontend

# Therapist frontend ONLY. Runs on its own EC2.
# NEVER touches Backend/Admin EC2, Flask, MySQL, migrations, seeds or the Admin frontend.
#
# DEV : push to main                    -> deploy to Therapist DEV
# PROD: push of a v* tag (e.g. v1.4.0)   -> deploy to Therapist PROD
# Manual: workflow_dispatch (choose dev|prod)
#
# PROD deploys the exact commit the tag (or dispatched ref) points at.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: "Which environment to deploy"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # DEV  ->  push to main  (or manual target=dev)
  # ---------------------------------------------------------------------------
  deploy-dev:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'dev')
    runs-on: ubuntu-latest
    environment: Development
    concurrency:
      group: therapist-deploy-dev
      cancel-in-progress: false
    env:
      OUT_DIR: dist/therapist-dev
      REMOTE_TARGET: /var/www/mental-health-therapist
    steps:
      - name: Preflight - required DEV secrets present
        env:
          DEV_THERAPIST_HOST: ${{ secrets.DEV_THERAPIST_HOST }}
          DEV_THERAPIST_URL: ${{ secrets.DEV_THERAPIST_URL }}
          DEV_API_URL: ${{ secrets.DEV_API_URL }}
          DEV_SSH_USER: ${{ secrets.DEV_SSH_USER }}
          DEV_SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for name in DEV_THERAPIST_HOST DEV_THERAPIST_URL DEV_API_URL DEV_SSH_USER DEV_SSH_PRIVATE_KEY; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing DEV secrets: ${missing[*]}"
            echo "Set each as a SEPARATE Development environment secret (name = value, no combined blob)."
            exit 1
          fi
          echo "All 5 DEV secrets present."

      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node 16
        uses: actions/setup-node@v4
        with:
          node-version: "16"

      - name: Install dependencies (locked, legacy peer deps)
        run: npm ci --legacy-peer-deps

      - name: Generate DEV runtime config (assets/prod.json)
        env:
          API_URL: ${{ secrets.DEV_API_URL }}
        run: |
          set -euo pipefail
          if [ -z "${API_URL:-}" ]; then
            echo "::error::DEV_API_URL secret is empty"; exit 1
          fi
          case "$API_URL" in
            *localhost:5000*|*192.168.*) echo "::error::DEV_API_URL points at a forbidden local address"; exit 1;;
          esac
          printf '{\n  "url": "%s"\n}\n' "$API_URL" > src/assets/prod.json
          echo "Generated src/assets/prod.json:"; cat src/assets/prod.json

      - name: Build Angular (production configuration)
        run: npx ng build --configuration production

      - name: Verify build output
        run: |
          set -euo pipefail
          test -f "$OUT_DIR/index.html"        || { echo "::error::missing $OUT_DIR/index.html"; exit 1; }
          test -f "$OUT_DIR/assets/prod.json"  || { echo "::error::missing $OUT_DIR/assets/prod.json"; exit 1; }
          grep -q '"url"' "$OUT_DIR/assets/prod.json" || { echo "::error::prod.json has no url"; exit 1; }
          echo "Deployed prod.json:"; cat "$OUT_DIR/assets/prod.json"
          if grep -rIq -e 'localhost:5000' -e '192\.168\.[0-9]\{1,3\}\.[0-9]\{1,3\}:5000' "$OUT_DIR"; then
            echo "::error::forbidden local API URL found in build output"; exit 1
          fi
          echo "No forbidden URLs in build output."

      - name: Package build
        run: tar -czf therapist-build.tgz -C "$OUT_DIR" .

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.DEV_THERAPIST_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload build to Therapist DEV EC2
        env:
          HOST: ${{ secrets.DEV_THERAPIST_HOST }}
          USER: ${{ secrets.DEV_SSH_USER }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_deploy therapist-build.tgz "$USER@$HOST:/tmp/therapist-${GITHUB_SHA}.tgz"

      - name: Deploy on Therapist DEV EC2 (safe swap + nginx reload)
        env:
          HOST: ${{ secrets.DEV_THERAPIST_HOST }}
          USER: ${{ secrets.DEV_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy "$USER@$HOST" \
            "SHA='${GITHUB_SHA}' TARGET='${REMOTE_TARGET}' bash -s" <<'REMOTE'
          set -euo pipefail
          STAGE="$HOME/therapist-stage-${SHA}"
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          tar -xzf "/tmp/therapist-${SHA}.tgz" -C "$STAGE"

          # Validate staged build BEFORE touching the live directory
          test -f "$STAGE/index.html"
          test -f "$STAGE/assets/prod.json"
          grep -q '"url"' "$STAGE/assets/prod.json"
          if grep -rIq -e 'localhost:5000' -e '192\.168\.[0-9]\{1,3\}\.[0-9]\{1,3\}:5000' "$STAGE"; then
            echo "FORBIDDEN local API URL in staged build"; exit 1
          fi

          TS="$(date +%Y%m%d-%H%M%S)"
          if [ -d "$TARGET" ]; then sudo cp -a "$TARGET" "${TARGET}.bak-${TS}"; fi
          sudo mkdir -p "$TARGET"
          sudo rsync -a --delete "$STAGE"/ "$TARGET"/

          sudo nginx -t
          sudo systemctl reload nginx

          code=$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1/ || echo 000)
          echo "local nginx HTTP: $code"

          rm -rf "$STAGE" "/tmp/therapist-${SHA}.tgz"
          REMOTE

      - name: Verify DEV site HTTP 200 + prod.json
        env:
          URL: ${{ secrets.DEV_THERAPIST_URL }}
        run: |
          set -euo pipefail
          code=$(curl -fsS -o /dev/null -w '%{http_code}' "$URL" || echo 000)
          echo "$URL -> $code"
          [ "$code" = "200" ] || { echo "::error::DEV site did not return 200"; exit 1; }
          pj=$(curl -fsS "${URL%/}/assets/prod.json")
          echo "$pj"
          echo "$pj" | grep -q '"url"' || { echo "::error::prod.json missing on DEV"; exit 1; }
          echo "$pj" | grep -Eq 'localhost:5000|192\.168\.[0-9]+\.[0-9]+:5000' && { echo "::error::forbidden URL served on DEV"; exit 1; } || true

  # ---------------------------------------------------------------------------
  # PROD ->  v* tag pushed  (or manual target=prod)
  # ---------------------------------------------------------------------------
  deploy-prod:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'prod')
    runs-on: ubuntu-latest
    environment: Production
    concurrency:
      group: therapist-deploy-prod
      cancel-in-progress: false
    env:
      OUT_DIR: dist/therapist-dev
      REMOTE_TARGET: /var/www/mental-health-therapist
    steps:
      - name: Preflight - required PROD secrets present
        env:
          PROD_THERAPIST_HOST: ${{ secrets.PROD_THERAPIST_HOST }}
          PROD_THERAPIST_URL: ${{ secrets.PROD_THERAPIST_URL }}
          PROD_API_URL: ${{ secrets.PROD_API_URL }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=()
          for name in PROD_THERAPIST_HOST PROD_THERAPIST_URL PROD_API_URL PROD_SSH_USER PROD_SSH_PRIVATE_KEY; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing PROD secrets: ${missing[*]}"
            echo "Set each as a SEPARATE Production environment secret (name = value, no combined blob)."
            exit 1
          fi
          echo "All 5 PROD secrets present."

      - name: Checkout exact tagged commit
        uses: actions/checkout@v4
        with:
          # tag push -> the tagged commit; manual -> the dispatched ref
          ref: ${{ github.sha }}

      - name: Setup Node 16
        uses: actions/setup-node@v4
        with:
          node-version: "16"

      - name: Install dependencies (locked, legacy peer deps)
        run: npm ci --legacy-peer-deps

      - name: Generate PROD runtime config (assets/prod.json)
        env:
          API_URL: ${{ secrets.PROD_API_URL }}
        run: |
          set -euo pipefail
          if [ -z "${API_URL:-}" ]; then
            echo "::error::PROD_API_URL secret is empty"; exit 1
          fi
          case "$API_URL" in
            *localhost:5000*|*192.168.*) echo "::error::PROD_API_URL points at a forbidden local address"; exit 1;;
          esac
          printf '{\n  "url": "%s"\n}\n' "$API_URL" > src/assets/prod.json
          echo "Generated src/assets/prod.json:"; cat src/assets/prod.json

      - name: Build Angular (production configuration)
        run: npx ng build --configuration production

      - name: Verify build output
        run: |
          set -euo pipefail
          test -f "$OUT_DIR/index.html"        || { echo "::error::missing $OUT_DIR/index.html"; exit 1; }
          test -f "$OUT_DIR/assets/prod.json"  || { echo "::error::missing $OUT_DIR/assets/prod.json"; exit 1; }
          grep -q '"url"' "$OUT_DIR/assets/prod.json" || { echo "::error::prod.json has no url"; exit 1; }
          echo "Deployed prod.json:"; cat "$OUT_DIR/assets/prod.json"
          if grep -rIq -e 'localhost:5000' -e '192\.168\.[0-9]\{1,3\}\.[0-9]\{1,3\}:5000' "$OUT_DIR"; then
            echo "::error::forbidden local API URL found in build output"; exit 1
          fi
          echo "No forbidden URLs in build output."

      - name: Package build
        run: tar -czf therapist-build.tgz -C "$OUT_DIR" .

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.PROD_THERAPIST_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload build to Therapist PROD EC2
        env:
          HOST: ${{ secrets.PROD_THERAPIST_HOST }}
          USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_deploy therapist-build.tgz "$USER@$HOST:/tmp/therapist-${GITHUB_SHA}.tgz"

      - name: Deploy on Therapist PROD EC2 (safe swap + nginx reload)
        env:
          HOST: ${{ secrets.PROD_THERAPIST_HOST }}
          USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy "$USER@$HOST" \
            "SHA='${GITHUB_SHA}' TARGET='${REMOTE_TARGET}' bash -s" <<'REMOTE'
          set -euo pipefail
          STAGE="$HOME/therapist-stage-${SHA}"
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          tar -xzf "/tmp/therapist-${SHA}.tgz" -C "$STAGE"

          test -f "$STAGE/index.html"
          test -f "$STAGE/assets/prod.json"
          grep -q '"url"' "$STAGE/assets/prod.json"
          if grep -rIq -e 'localhost:5000' -e '192\.168\.[0-9]\{1,3\}\.[0-9]\{1,3\}:5000' "$STAGE"; then
            echo "FORBIDDEN local API URL in staged build"; exit 1
          fi

          TS="$(date +%Y%m%d-%H%M%S)"
          if [ -d "$TARGET" ]; then sudo cp -a "$TARGET" "${TARGET}.bak-${TS}"; fi
          sudo mkdir -p "$TARGET"
          sudo rsync -a --delete "$STAGE"/ "$TARGET"/

          sudo nginx -t
          sudo systemctl reload nginx

          code=$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1/ || echo 000)
          echo "local nginx HTTP: $code"

          rm -rf "$STAGE" "/tmp/therapist-${SHA}.tgz"
          REMOTE

      - name: Verify PROD site HTTP 200 + prod.json
        env:
          URL: ${{ secrets.PROD_THERAPIST_URL }}
        run: |
          set -euo pipefail
          code=$(curl -fsS -o /dev/null -w '%{http_code}' "$URL" || echo 000)
          echo "$URL -> $code"
          [ "$code" = "200" ] || { echo "::error::PROD site did not return 200"; exit 1; }
          pj=$(curl -fsS "${URL%/}/assets/prod.json")
          echo "$pj"
          echo "$pj" | grep -q '"url"' || { echo "::error::prod.json missing on PROD"; exit 1; }
          echo "$pj" | grep -Eq 'localhost:5000|192\.168\.[0-9]+\.[0-9]+:5000' && { echo "::error::forbidden URL served on PROD"; exit 1; } || true
