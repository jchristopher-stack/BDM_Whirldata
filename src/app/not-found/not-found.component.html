<section class="not-found" aria-labelledby="not-found-title">
    <img class="not-found-logo" src="assets/img/TAAP.svg" alt="TAAP">
    <p class="not-found-code">Error 404</p>
    <h1 id="not-found-title" class="heading-reset not-found-title">We can't find that page</h1>
    <p class="not-found-text">The link may be out of date, or the address may have a typo.</p>
    <div class="not-found-actions">
        <a pButton routerLink="/clients" label="Go to clients"></a>
        <button pButton type="button" class="p-button-text" label="Go back" (click)="location.back()"></button>
    </div>
</section>
