<app-auth-layout>
    <h1 class="heading-reset auth-title">Welcome back</h1>
    <p class="auth-sub">Sign in to see your clients and their activities.</p>

    <form class="auth-form" (ngSubmit)="signInUser()" novalidate>
        <div class="field">
            <label class="field-label" for="email">Email</label>
            <input id="email" name="email" tw-select="sign-in-email" pInputText type="email" autocomplete="email" [(ngModel)]="email" (ngModelChange)="form.clear('email')"
                [class.p-invalid]="form.errors.email" [attr.aria-invalid]="form.errors.email ? true : null" [attr.aria-describedby]="form.errors.email ? 'email-error' : null">
            <div class="field-error" id="email-error" *ngIf="form.errors.email">{{form.errors.email}}</div>
        </div>
        <div class="field">
            <app-password-field name="password" inputId="password" tw-select="sign-in-password" label="Password" autocomplete="current-password"
                [(ngModel)]="password" (ngModelChange)="form.clear('password')" [error]="form.errors.password"></app-password-field>
            <div class="auth-forgot">
                <a class="auth-link" routerLink="/forgot-password" tw-select="nav-forgot-password" id="forgot-password">Forgot password?</a>
            </div>
        </div>
        <button pButton type="submit" class="auth-submit" tw-select="sign-in-btn" label="Sign in"></button>
    </form>

    <div authFooter>Have an activation code? <a class="auth-link" routerLink="/sign-up" tw-select="nav-signup">Activate your account</a></div>
</app-auth-layout>
