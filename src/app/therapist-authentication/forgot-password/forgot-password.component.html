<app-auth-layout>
    <ng-container *ngIf="!linkSent">
        <a class="auth-link auth-back" routerLink="/sign-in" tw-select="forgot-password-back"><i class="pi pi-arrow-left" aria-hidden="true"></i>Back to sign in</a>
        <h1 class="heading-reset auth-title">Forgot your password?</h1>
        <p class="auth-sub">Enter the email you sign in with and we'll send you a link to reset it.</p>

        <form class="auth-form" (ngSubmit)="forgotPassword()" novalidate>
            <div class="field">
                <label class="field-label" for="forgot-email">Email</label>
                <input id="forgot-email" name="email" tw-select="forgot-password-email" pInputText type="email" autocomplete="email" [(ngModel)]="email" (ngModelChange)="form.clear('email')"
                    [class.p-invalid]="form.errors.email" [attr.aria-invalid]="form.errors.email ? true : null" [attr.aria-describedby]="form.errors.email ? 'forgot-email-error' : null">
                <div class="field-error" id="forgot-email-error" *ngIf="form.errors.email">{{form.errors.email}}</div>
            </div>
            <button pButton type="submit" class="auth-submit" tw-select="forgot-password-btn" label="Send reset link"></button>
        </form>
    </ng-container>

    <div *ngIf="linkSent" role="status">
        <div class="auth-done-icon" aria-hidden="true"><i class="pi pi-envelope"></i></div>
        <h1 class="heading-reset auth-title">Check your email</h1>
        <p class="auth-sub">We sent a reset link to <strong>{{email}}</strong>. It can take a minute to arrive; check your spam folder if you don't see it.</p>
        <div class="auth-actions">
            <a pButton class="auth-submit" routerLink="/sign-in" label="Back to sign in"></a>
            <button pButton type="button" class="p-button-text" label="Use a different email" (click)="linkSent = false"></button>
        </div>
    </div>
</app-auth-layout>
