<app-auth-layout>
    <p class="auth-step">Step 2 of 2</p>
    <h1 class="heading-reset auth-title">Create your password</h1>
    <p class="auth-sub">You'll sign in with <strong>{{emailId}}</strong> and this password.</p>

    <form class="auth-form" (ngSubmit)="setPassword()" novalidate>
        <!-- Lets password managers save the new password against the right account. -->
        <input class="visually-hidden" type="email" name="username" autocomplete="username" [value]="emailId" tabindex="-1" aria-hidden="true" readonly>
        <div class="field">
            <app-password-field name="password" inputId="set-password" label="Password" autocomplete="new-password" [hint]="passwordHint"
                [(ngModel)]="password" (ngModelChange)="form.clear('password')" [error]="form.errors.password"></app-password-field>
        </div>
        <div class="field">
            <app-password-field name="confirmPassword" inputId="set-password-confirm" label="Confirm password" autocomplete="new-password"
                [(ngModel)]="confirmPassword" (ngModelChange)="form.clear('confirm_password')" [error]="form.errors.confirm_password"></app-password-field>
        </div>
        <button pButton type="submit" class="auth-submit" label="Create account"></button>
    </form>
</app-auth-layout>
