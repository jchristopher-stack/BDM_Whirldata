<app-auth-layout [product]="isTherapist ? 'Therapist Portal' : ''">
    <ng-container *ngIf="!resetDone">
        <h1 class="heading-reset auth-title">Reset your password</h1>
        <p class="auth-sub">Choose a new password for <strong>{{emailId}}</strong>.</p>

        <form class="auth-form" (ngSubmit)="resetPassword()" novalidate>
            <!-- Lets password managers save the new password against the right account. -->
            <input class="visually-hidden" type="email" name="username" autocomplete="username" [value]="emailId" tabindex="-1" aria-hidden="true" readonly>
            <div class="field">
                <app-password-field name="password" inputId="reset-password" label="New password" autocomplete="new-password" [hint]="passwordHint"
                    [(ngModel)]="password" (ngModelChange)="form.clear('password')" [error]="form.errors.password"></app-password-field>
            </div>
            <div class="field">
                <app-password-field name="confirmPassword" inputId="reset-password-confirm" label="Confirm new password" autocomplete="new-password"
                    [(ngModel)]="confirmPassword" (ngModelChange)="form.clear('confirm_password')" [error]="form.errors.confirm_password"></app-password-field>
            </div>
            <button pButton type="submit" class="auth-submit" label="Reset password"></button>
        </form>
    </ng-container>

    <!-- Clients reset from the mobile app; they go back there to sign in. -->
    <div *ngIf="resetDone" role="status">
        <div class="auth-done-icon" aria-hidden="true"><i class="pi pi-check"></i></div>
        <h1 class="heading-reset auth-title">Password reset</h1>
        <p class="auth-sub">Go back to the TAAP app and sign in with your new password. You can close this page.</p>
    </div>
</app-auth-layout>
