<a class="skip-link" href="#main-content" (click)="skipToMain($event)">Skip to main content</a>
<div class="app-main" [ngClass]="{'d-block': !showSideNavbar()}">
    <app-side-bar class="side-bar" *ngIf="showSideNavbar()"></app-side-bar>
    <main class="app-content" id="main-content" tabindex="-1">
        <router-outlet></router-outlet>
    </main>
</div>

<!-- To show the response message and loader for whole application-->
<app-loader-pop></app-loader-pop>
<app-message-pop></app-message-pop>
