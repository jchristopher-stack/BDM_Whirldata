<label class="field-label" [attr.for]="inputId">{{label}}</label>
<div class="pw-wrap">
    <input pInputText [id]="inputId" [type]="visible ? 'text' : 'password'" [attr.autocomplete]="autocomplete" [value]="value" [disabled]="disabled"
        autocapitalize="off" spellcheck="false" (input)="onInput($event)" (blur)="onTouched()" (keydown.enter)="enter.emit()"
        [class.p-invalid]="error" [attr.aria-invalid]="error ? true : null" [attr.aria-describedby]="describedBy">
    <button type="button" class="btn-icon pw-toggle" (click)="toggleVisible()" [disabled]="disabled"
        [attr.aria-label]="visible ? 'Hide password' : 'Show password'" [attr.aria-pressed]="visible" [attr.aria-controls]="inputId">
        <i class="pi" [ngClass]="visible ? 'pi-eye-slash' : 'pi-eye'" aria-hidden="true"></i>
    </button>
</div>
<div class="field-hint" [id]="inputId + '-hint'" *ngIf="hint && !error">{{hint}}</div>
<div class="field-error" [id]="inputId + '-error'" *ngIf="error">{{error}}</div>
