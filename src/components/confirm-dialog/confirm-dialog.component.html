<p-dialog [header]="header" [visible]="visible" (visibleChange)="visibleChange.emit($event)" [modal]="true"
    [draggable]="false" [resizable]="false" [style]="{width: '440px'}" [breakpoints]="{'640px': '92vw'}"
    styleClass="app-confirm-dialog">
    <div class="app-confirm-dialog-body">
        <ng-content></ng-content>
    </div>
    <ng-template pTemplate="footer">
        <button pButton type="button" class="p-button-text" [label]="cancelLabel" (click)="onCancel()"></button>
        <button pButton type="button" [label]="confirmLabel" [ngClass]="{'p-button-danger': danger}" (click)="onConfirm()"></button>
    </ng-template>
</p-dialog>
