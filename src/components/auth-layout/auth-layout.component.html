<div class="auth-page">
    <div class="auth-side">
        <div class="auth-brand">
            <img class="auth-logo" src="assets/img/TAAP.svg" alt="">
            <div>
                <div class="auth-brand-name">TAAP</div>
                <div class="auth-brand-sub" *ngIf="product">{{product}}</div>
            </div>
        </div>

        <div class="auth-card">
            <ng-content></ng-content>
        </div>

        <div class="auth-footer">
            <ng-content select="[authFooter]"></ng-content>
        </div>
    </div>

    <div class="auth-art" aria-hidden="true">
        <div class="auth-art-photo"></div>
    </div>
</div>
