<div class="skeleton" [ngClass]="'skeleton-' + variant" role="status" aria-live="polite" aria-busy="true">
    <span class="visually-hidden">Loading</span>

    <ng-container *ngIf="variant == 'rows'">
        <div class="skeleton-row" [class.skeleton-row-compact]="compact" *ngFor="let i of items" aria-hidden="true">
            <p-skeleton shape="circle" [size]="compact ? '2.125rem' : '2.625rem'"></p-skeleton>
            <div class="skeleton-row-text">
                <p-skeleton [width]="compact ? '70%' : '40%'" height="0.875rem"></p-skeleton>
                <p-skeleton *ngIf="!compact" width="22%" height="0.75rem"></p-skeleton>
            </div>
            <p-skeleton [width]="compact ? '5.5rem' : '9rem'" [height]="compact ? '1.75rem' : '1.25rem'" borderRadius="6px"></p-skeleton>
        </div>
    </ng-container>

    <ng-container *ngIf="variant == 'cards'">
        <div class="skeleton-card" *ngFor="let i of items" aria-hidden="true">
            <p-skeleton width="60%" height="0.875rem"></p-skeleton>
            <p-skeleton width="30%" height="0.75rem"></p-skeleton>
            <div class="skeleton-card-dots">
                <p-skeleton shape="circle" size="1.25rem"></p-skeleton>
                <p-skeleton shape="circle" size="1.25rem"></p-skeleton>
                <p-skeleton shape="circle" size="1.25rem"></p-skeleton>
            </div>
        </div>
    </ng-container>

    <ng-container *ngIf="variant == 'fields'">
        <p-skeleton *ngFor="let i of items" height="3.25rem" borderRadius="6px" aria-hidden="true"></p-skeleton>
    </ng-container>

    <ng-container *ngIf="variant == 'lines'">
        <p-skeleton *ngFor="let i of items" [width]="lineWidth(i)" height="0.875rem" aria-hidden="true"></p-skeleton>
    </ng-container>
</div>
